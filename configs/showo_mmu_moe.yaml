mlflow:
    enabled: true
    tracking_uri: "file:./mlruns"
    experiment_name: "moe-training"
    tags:
        model: "show-o"
        task: "mmu"
        moe_experts: "8"

mode: "t2i"

experiment:
    project: "moe-training"
    name: "showo-vanilla-mmu"
    output_dir: "output/showo-vanilla-mmu"
    max_train_examples_t2i: 20000000
    max_train_examples_mmu: 40000000
    save_every: 3000
    eval_every: 2500
    generate_every: 500
    log_every: 50
    log_grad_norm_every: 500
    resume_from_checkpoint: false

evaluation:
    metric_interval: 200
    coco:
        enabled: true
        images_root: "/home/jovyan/vasiliev/notebooks/Show-o/train2017"
        ann_file: "/home/jovyan/vasiliev/notebooks/Show-o/annotations/captions_train2017.json"
        subset_size: 100 
        batch_size: 4
        seed: 42
    mmu:
        enabled: true
        dataset_type: "mmmu"
        subset_size: 100
        batch_size: 4
        seed: 42

moe:
    enabled: true
    num_experts: 8
    top_k: 2
    count_layers_to_patch: 6
    freeze_base_model: false   # ❗ Размораживаем - модель должна адаптироваться к MoE!
    save_only_moe_weights: false
    learning_rate: null  
    activation_stats:
        collect_frequency: 5

    temp_fixed: null           # Фиксированная температура 1.0 (стабильная)
    temp_start: 20.0
    temp_end: 1.0
    temp_steps: 1000
    balance_warmup_steps: 500
    balance_gamma: 0.999
    
    use_modality_bias: false   # Отключаем на первом этапе
    use_domain_bias: false
    modality_init_hardness: 0.0
    modality_init_steps: 1
    modality_init_hardness_min: 0.0
    domain_init_hardness: 0.0
    domain_init_steps: 1
    domain_init_hardness_min: 0.0
    domain_to_expert_map:
        vqav2_experiments: [0, 1, 2, 3, 4]
        textvqa_experiments: [3, 4, 5, 6, 7]
    use_gumbel: false
    gate_capacity: [2.0, 4.0]  # Увеличенный capacity (меньше pruning)
    random_routing: false      # Отключаем

    noise_std: 0.0            # ❗ БЕЗ шума - эксперты = точные копии MLP
    log_gates: True
    log_activations: True
    log_frequency: 50
    log_domain_flow_gates: True

model:
    vq_model:
        type: "magvitv2"
        vq_model_name: "showlab/magvitv2"

    showo:
        load_from_showo: True
        pretrained_model_path: "showlab/show-o-w-clip-vit"
        w_clip_vit: True
        vocab_size: 58498
        llm_vocab_size: 50295
        llm_model_path: "microsoft/phi-1_5"
        codebook_size: 8192
        num_vq_tokens: 256
        num_new_special_tokens: 10

    gradient_checkpointing: True

dataset:
    gen_type: "imagenet1k"
    und_type: "llava_pretrain"
    combined_loader_mode: "max_size_cycle"
    add_system_prompt: False

    use_vqav2: false
    use_textvqa: false
    use_textvqa_experiments: false  
    use_vqav2_experiments: false
    use_clevr: false
    use_docvqa: false
    use_kvasir: false
    params:
        train_t2i_shards_path_or_url: "/home/jovyan/vasiliev/notebooks/Show-o/data/llava_pretrain/images"
        train_lm_shards_path_or_url: "/home/jovyan/vasiliev/notebooks/Show-o/data/llava_pretrain"
        validation_prompts_file: "validation_prompts/text2image_prompts.txt"
        num_workers: 8
        shuffle_buffer_size: 1000
        pin_memory: True
        persistent_workers: True

        vqav2_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/data/vqav2/train.json"
        vqav2_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/data/vqav2/images"

        textvqa_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/data/textvqa/train.json"
        textvqa_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/data/textvqa/images"

        textvqa_experiments_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/textvqa/train.json"
        textvqa_experiments_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/textvqa/images"

        vqav2_experiments_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/vqav2/train.json"
        vqav2_experiments_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/vqav2/images"

        clevr_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/clevr/train.json"
        clevr_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/moe_experiments/data/clevr/images"

        docvqa_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/data/docvqa/train.json"
        docvqa_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/data/docvqa/images"
        kvasir_data_file_path: "/home/jovyan/vasiliev/notebooks/Show-o/data/kvasir/train.json"
        kvasir_image_root: "/home/jovyan/vasiliev/notebooks/Show-o/data/kvasir/images"
    preprocessing:
        max_seq_length: 256
        resolution: 256

optimizer:
    name: adamw
    params:
        learning_rate: 0.00005     # Базовая модель fine-tune
        moe_learning_rate: 0.0002  # Gate учится быстрее (случайно инициализирован)
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01        # Уменьшенная регуляризация
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000

training:
    gradient_accumulation_steps: 1
    noise_type: "mask"

    batch_size: ${.batch_size_t2i}
    batch_size_t2i: 2
    batch_size_lm: 1
    batch_size_mmu: 2
    batch_size_vqav2: 2
    batch_size_vqav2_experiments: 2
    batch_size_textvqa: 2
    batch_size_textvqa_experiments: 2
    batch_size_clevr: 2
    batch_size_docvqa: 2
    batch_size_kvasir: 2

    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    max_train_steps: 100000
    overfit_one_batch: False
    cond_dropout_prob: 0.1
    min_masking_rate: 0.0
    label_smoothing: 0.0
    max_grad_norm: 1.0
    guidance_scale: 3.0
    generation_timesteps: 18
    t2i_coeff: 1.0
    lm_coeff: 0.0
    mmu_coeff: 1.0
    orthogonal_coeff: 0.00

    balance_coeff: 0.01  # Увеличили (т.к. уменьшили множитель в loss)
    
    profiler_enabled: True
